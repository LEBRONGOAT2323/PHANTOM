<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHANTOM MOVIES</title>
    <meta name="robots" content="noindex, nofollow">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
    <style>
        :root {
            --accent: #ff8c00;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Orbitron', sans-serif;
            background: #000;
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* BACKGROUND */
        #stars {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: .7;
            animation: drift linear infinite;
        }

        @keyframes drift {
            from {
                transform: translateY(0);
            }
            to {
                transform: translateY(-120vh);
            }
        }

        #bottom-glow {
            position: fixed;
            bottom: -35vh;
            left: 50%;
            transform: translateX(-50%);
            width: 140vw;
            height: 80vh;
            pointer-events: none;
            z-index: 0;
        }

        /* MAIN */
        .page {
            position: relative;
            z-index: 1;
            max-width: 1100px;
            margin: auto;
            padding: 40px 24px 80px;
        }

        /* HEADER */
        .header-nav {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 45px;
            flex-direction: row-reverse;
          }      
        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, .5);
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
            font-size: .7rem;
            cursor: pointer;
            order: 2;
        }

        .back-btn:hover {
            color: var(--accent);
        }

        .logo-section { text-align: right; order:1; }
  
  .logo {
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 900;
    letter-spacing: 8px;
    color: white;
    line-height: 1;
    margin-bottom: 4px;
    transition: text-shadow 0.4s ease;
}

        .page-subtitle {
            margin-top: 5px;
            font-size: .65rem;
            letter-spacing: 4px;
            opacity: .4;
        }

        /* SEARCH */
        .search-container {
            position: relative;
            max-width: 500px;
            margin-bottom: 35px;
        }

        .search-container i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            opacity: .35;
        }

        input {
            width: 100%;
            background: rgba(255, 255, 255, .03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, .1);
            border-radius: 12px;
            padding: 14px 20px 14px 45px;
            color: white;
            outline: none;
            font-family: 'Orbitron', sans-serif;
            font-size: .8rem;
            letter-spacing: 1px;
        }

        input:focus {
            border-color: var(--accent);
        }

        /* SELECTS */
        select {
    background: rgba(255,255,255,.05);
    color: white;
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 10px;
    padding: 10px;
    font-family: 'Orbitron', sans-serif;
    appearance: none;
}

select option {
    background: #111;
    color: white;
}

        /* MOVIE GRID */
        #results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
        }

        .card {
            background: rgba(255, 255, 255, .03);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, .08);
            cursor: pointer;
            transition: .3s;
            position: relative;
            aspect-ratio: 1/1.45;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: var(--accent);
            box-shadow: 0 0 25px rgba(255, 140, 0, .2);
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 15px 10px;
            background: linear-gradient(transparent, rgba(0, 0, 0, .9));
        }

        .card-title {
            font-size: .7rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .card-year {
            font-size: .55rem;
            opacity: .5;
            margin-top: 5px;
        }

        /* MOVIE PLAYER */
        #player {
            position: fixed;
            inset: 0;
            z-index: 10000;
            background: #000;
            display: none; 
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* BUTTONS */
        #backBtn, #loadMoreBtn {
            background: rgba(0, 0, 0, .7);
            color: white;
            border: 1px solid var(--accent);
            border-radius: 10px;
            padding: 10px 18px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
        }

        #backBtn:hover, #loadMoreBtn:hover {
            background: var(--accent);
            color: #000;
        }

        #episodeControls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            display: none; /* Hidden unless it's a TV show */
        }

        /* FOOTER */
        .version {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            opacity: .3;
            font-size: .65rem;
            letter-spacing: 3px;
        }

        #phantom-dot {
            position: fixed;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 999999;
        }

        @media (max-width: 600px) {
    .header-nav { flex-direction: column; gap: 20px; }
    .logo-section { text-align: right; }
}

    </style>
</head>

<body>

<div id="bottom-glow"></div>
<div id="stars"></div>

<!-- MOVIE VIEWER -->
<div id="player"></div>

<div class="page">
    <div class="header-nav">
        <button class="back-btn" onclick="history.back()">
    <i class="fa-solid fa-chevron-left"></i>
    BACK
</button>

<button class="back-btn" id="backBtn" style="display:none;">
    <i class="fa-solid fa-xmark"></i>
    EXIT
</button>

        <div class="logo-section">
            <h1 class="logo" id="logo">PHANTOM</h1>
            <div class="page-subtitle">MOVIES</div>
        </div>
    </div>

    <div class="search-container">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input id="search" placeholder="SEARCH MOVIES OR SHOWS...">
    </div>

    <select id="domainSelect">
        <option value="https://vidfast.pro">VIDFAST.PRO</option>
        <option value="https://vidfast.in">VIDFAST.IN</option>
        <option value="https://vidfast.io">VIDFAST.IO</option>
        <option value="https://vidfast.me">VIDFAST.ME</option>
        <option value="https://vidfast.net">VIDFAST.NET</option>
        <option value="https://vidfast.pm">VIDFAST.PM</option>
        <option value="https://vidfast.xyz">VIDFAST.XYZ</option>
    </select>

    <div id="episodeControls">
        <select id="seasonSelect"></select>
        <select id="episodeSelect"></select>
    </div>

    <h2 id="sectionTitle" style="margin:35px 0 20px; letter-spacing:3px; font-size:1rem; opacity:.7;">
        POPULAR
    </h2>

    <div id="results">
        <div style="opacity:.5; letter-spacing:3px;">CONNECTING TO MOVIES...</div>
    </div>

    <button id="loadMoreBtn" style="margin-top:30px;">LOAD MORE</button>
</div>

<div class="version" id="version">PHANTOM MOVIES</div>
<div id="phantom-dot"></div>

<script>
const API_KEY = "58c450a9e134b118a282f43b3aea9da1";

const results = document.getElementById("results");
const searchInput = document.getElementById("search");
const player = document.getElementById("player");
const backBtn = document.getElementById("backBtn");
const sectionTitle = document.getElementById("sectionTitle");
const episodeControls = document.getElementById("episodeControls");
const seasonSelect = document.getElementById("seasonSelect");
const episodeSelect = document.getElementById("episodeSelect");
const loadMoreBtn = document.getElementById("loadMoreBtn");
const domainSelect = document.getElementById("domainSelect");

let combined = [];
let page = 1;
let currentShowId = null;

/* =========================
   PHANTOM STARS
========================= */
const stars = document.getElementById("stars");

for(let i=0; i<35; i++){
    let star = document.createElement("div");
    star.className = "star";
    let size = Math.random() * 2 + 1;
    star.style.width = size + "px";
    star.style.height = size + "px";
    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 120 + "%";
    star.style.animationDuration = (80 + Math.random() * 80) + "s";
    stars.appendChild(star);
}

/* =========================
   ACCENT SYSTEM
========================= */
function hexToRgb(hex){
    let r = parseInt(hex.substring(1,3), 16);
    let g = parseInt(hex.substring(3,5), 16);
    let b = parseInt(hex.substring(5,7), 16);
    return `${r},${g},${b}`;
}

function applyAccent(color){
    document.documentElement.style.setProperty("--accent", color);
    const logo = document.getElementById("logo");
    if(logo){
        logo.style.textShadow = `0 0 15px ${color}, 0 0 35px ${color}`;
    }
    const glow = document.getElementById("bottom-glow");
    if(glow){
        glow.style.background = `radial-gradient(ellipse, rgba(${hexToRgb(color)},.15), transparent 70%)`;
    }
}

/* =========================
   MOVIES logic
========================= */
function getDomain(){
    return domainSelect.value;
}

function renderVisible(){
    results.innerHTML = "";
    combined.forEach(createCard);
}

function createCard(item){
    if(!item.poster_path) return;
    const title = item.title || item.name;
    const year = (item.release_date || item.first_air_date || "").slice(0,4);

    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
        <img src="https://image.tmdb.org/t/p/w500${item.poster_path}">
        <div class="card-info">
            <div class="card-title">${title}</div>
            <div class="card-year">${year}</div>
        </div>
    `;
    div.onclick = () => openPlayer(item);
    results.appendChild(div);
}

async function fetchPopularPage(){
    const movies = await fetch(`https://api.themoviedb.org/3/movie/popular?api_key=${API_KEY}&page=${page}`).then(r=>r.json());
    const shows = await fetch(`https://api.themoviedb.org/3/tv/popular?api_key=${API_KEY}&page=${page}`).then(r=>r.json());

    combined.push(
        ...movies.results.map(x=>({...x, media_type:"movie"})),
        ...shows.results.map(x=>({...x, media_type:"tv"}))
    );
    renderVisible();
    page++;
}

async function openPlayer(item){
    results.style.display = "none";
    searchInput.style.display = "none";
    sectionTitle.style.display = "none";
    loadMoreBtn.style.display = "none";
    backBtn.style.display = "flex";
    player.style.display = "block";

    if(item.media_type === "movie"){
        episodeControls.style.display = "none";
        player.innerHTML = `
            <iframe src="${getDomain()}/movie/${item.id}" allowfullscreen></iframe>
        `;
    } else {
        currentShowId = item.id;
        episodeControls.style.display = "flex";
        const data = await fetch(`https://api.themoviedb.org/3/tv/${item.id}?api_key=${API_KEY}`).then(r=>r.json());

        seasonSelect.innerHTML = "";
        data.seasons.forEach(s => {
            if(s.season_number === 0) return;
            let o = document.createElement("option");
            o.value = s.season_number;
            o.textContent = `SEASON ${s.season_number}`;
            seasonSelect.appendChild(o);
        });
        loadEpisodes(item.id, 1);
    }
}

async function loadEpisodes(id, season){
    const data = await fetch(`https://api.themoviedb.org/3/tv/${id}/season/${season}?api_key=${API_KEY}`).then(r=>r.json());
    episodeSelect.innerHTML = "";
    data.episodes.forEach(e => {
        let o = document.createElement("option");
        o.value = e.episode_number;
        o.textContent = `EPISODE ${e.episode_number}`;
        episodeSelect.appendChild(o);
    });
    loadEpisodePlayer(id, season, 1);
}

function loadEpisodePlayer(id, s, e){
    player.innerHTML = `
        <iframe src="${getDomain()}/tv/${id}/${s}/${e}" allowfullscreen></iframe>
    `;
}

seasonSelect.onchange = () => {
    loadEpisodes(currentShowId, seasonSelect.value);
};

episodeSelect.onchange = () => {
    loadEpisodePlayer(currentShowId, seasonSelect.value, episodeSelect.value);
};

loadMoreBtn.onclick = fetchPopularPage;

searchInput.oninput = async () => {
    let q = searchInput.value.trim();
    if(!q){
        page = 1;
        combined = [];
        fetchPopularPage();
        return;
    }
    const data = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${encodeURIComponent(q)}`).then(r=>r.json());
    combined = data.results.filter(x => x.media_type === "movie" || x.media_type === "tv");
    renderVisible();
};

backBtn.onclick = () => {
    player.innerHTML = "";
    player.style.display = "none";
    results.style.display = "grid";
    searchInput.style.display = "block";
    sectionTitle.style.display = "block";
    loadMoreBtn.style.display = "block";
    episodeControls.style.display = "none";
    backBtn.style.display = "none";
};

/* =========================
   PHANTOM SETTINGS
========================= */
(function(){
    const accent = localStorage.getItem("phantom_accent") || "#ff8c00";
    applyAccent(accent);

    const wallpaper = localStorage.getItem("phantom_wallpaper");
    if(wallpaper){
        document.body.style.backgroundImage = `url('${wallpaper}')`;
        document.body.style.backgroundSize = "cover";
        document.body.style.backgroundPosition = "center";
    }

    /* tab cloak */
    if(localStorage.getItem("phantom_cloak_on") === "true"){
        const title = localStorage.getItem("phantom_cloak_name");
        if(title) document.title = title;
    }

    /* panic key */
    if(localStorage.getItem("phantom_panic_on") === "true"){
        document.addEventListener("keydown", e => {
            if(e.key === localStorage.getItem("phantom_panickey")){
                location.href = localStorage.getItem("phantom_panicurl") || "https://google.com";
            }
        });
    }
})();

fetchPopularPage();
</script>
</body>
</html>
