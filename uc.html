<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHANTOM | UNDER CONSTRUCTION</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
<style>
:root { --accent: #ff8c00; }
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Orbitron', sans-serif;
    background: #000;
    color: white;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
}

/* ── Background Elements ── */
#stars { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.star { position: absolute; background: rgba(255,255,255,0.7); border-radius: 50%; animation: drift linear infinite; }
@keyframes drift { from { transform: translateY(0); } to { transform: translateY(-120vh); } }

#bottom-glow {
    position: fixed;
    bottom: -35vh; left: 50%;
    transform: translateX(-50%);
    width: 140vw; height: 80vh;
    z-index: 0; pointer-events: none;
    transition: background 0.4s ease;
}

/* ── Content ── */
.container {
    position: relative;
    z-index: 1;
    text-align: center;
    max-width: 600px;
    padding: 40px;
}

.error-code {
    font-size: clamp(6rem, 15vw, 10rem);
    font-weight: 900;
    letter-spacing: 15px;
    line-height: 1;
    margin-bottom: 10px;
    animation: pulse 4s ease-in-out infinite;
}

@keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.05); opacity: 0.8; }
}

.error-title {
    font-size: 1rem;
    letter-spacing: 6px;
    opacity: 0.6;
    margin-bottom: 30px;
    text-transform: uppercase;
}

.error-desc {
    font-size: 0.75rem;
    letter-spacing: 2px;
    opacity: 0.4;
    line-height: 1.8;
    margin-bottom: 40px;
}

.home-btn {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 14px 30px;
    background: rgba(255,255,255,0.03);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    color: white;
    text-decoration: none;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    transition: all 0.3s ease;
}

.home-btn:hover {
    transform: translateY(-5px);
    background: rgba(255,255,255,0.07);
}

/* ── Cursor ── */
#phantom-dot {
    position: fixed;
    width: 10px; height: 10px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 999999;
    transform: translate(-50%, -50%);
    display: none;
}

.version {
    position: fixed; bottom: 20px; left: 50%;
    transform: translateX(-50%);
    font-size: 0.65rem; opacity: 0.3; z-index: 1;
    letter-spacing: 2px;
}
</style>
</head>
<body>

<div id="bottom-glow"></div>
<div id="stars"></div>

<div class="container">
    <div class="error-code" id="logo">UNDER CONSTRUCTION</div>
    <div class="error-title">System Error: Page Not Found</div>
    <p class="error-desc">
        The requested module is currently under construction or has been redacted from the PHANTOM interface. 
        Please verify the coordinates and try again.
    </p>
    <a href="index.html" class="home-btn" id="homeBtn">
        <i class="fa-solid fa-house"></i> Return to Home
    </a>
</div>

<div class="version">PHANTOM v0.6</div>
<div id="phantom-dot"></div>

<script>
/* ── Starfield Animation ── */
const sc = document.getElementById("stars");
for (let i = 0; i < 90; i++) {
    const s = document.createElement("div");
    s.className = "star";
    const size = Math.random() * 2 + 1;
    s.style.width = `${size}px`;
    s.style.height = `${size}px`;
    s.style.left = `${Math.random() * 100}%`;
    s.style.top = `${Math.random() * 120}%`;
    s.style.opacity = Math.random() * 0.6 + 0.2;
    s.style.animationDuration = `${Math.random() * 80 + 80}s`;
    s.style.animationDelay = `-${Math.random() * 100}s`;
    sc.appendChild(s);
}

/* ── Utility Functions ── */
function hexToRgb(hex) {
    const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    return {r,g,b};
}
function rgba(hex, a) {
    const {r,g,b} = hexToRgb(hex);
    return `rgba(${r},${g},${b},${a})`;
}

/* ── Apply System Settings ── */
function applyAccent(color) {
    document.documentElement.style.setProperty('--accent', color);

    /* 404 Glow */
    document.getElementById('logo').style.textShadow = `
        0 0 10px rgba(255,255,255,0.15),
        0 0 25px ${rgba(color,0.40)},
        0 0 50px ${rgba(color,0.25)},
        0 0 80px ${rgba(color,0.15)}`;

    /* Button Styling */
    const homeBtn = document.getElementById('homeBtn');
    homeBtn.style.borderColor = rgba(color, 0.3);
    
    let dynStyle = document.getElementById('error-dynamic-style');
    if (!dynStyle) { dynStyle = document.createElement('style'); dynStyle.id = 'error-dynamic-style'; document.head.appendChild(dynStyle); }
    dynStyle.textContent = `
        .home-btn:hover { 
            border-color: ${color}; 
            box-shadow: 0 0 20px ${rgba(color, 0.2)};
            color: ${color};
        }
        .home-btn i { color: ${color}; }
    `;

    /* Bottom glow */
    document.getElementById('bottom-glow').style.background =
        `radial-gradient(ellipse at center, ${rgba(color,0.12)} 0%, ${rgba(color,0.04)} 35%, transparent 70%)`;

    updateDotStyle(color);
}

/* ── Dot Cursor Logic ── */
const dot = document.getElementById('phantom-dot');
let dotActive = false;

function updateDotStyle(color) {
    if (!color) color = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
    dot.style.background = color;
    dot.style.boxShadow = `0 0 6px 2px ${color}, 0 0 14px 4px ${rgba(color,0.50)}, 0 0 28px 8px ${rgba(color,0.25)}`;
}

document.addEventListener('mousemove', e => {
    if (!dotActive) return;
    dot.style.left = e.clientX + 'px';
    dot.style.top = e.clientY + 'px';
});

function enableDotCursor() {
    dotActive = true; dot.style.display = 'block'; updateDotStyle();
    document.documentElement.style.cursor = 'none';
    let s = document.getElementById('dot-cursor-style');
    if (!s) { s = document.createElement('style'); s.id = 'dot-cursor-style'; s.textContent = '*{cursor:none!important;}'; document.head.appendChild(s); }
}

function disableDotCursor() {
    dotActive = false; dot.style.display = 'none';
    document.documentElement.style.cursor = '';
    const s = document.getElementById('dot-cursor-style'); if (s) s.remove();
}

/* ── Initialization ── */
(function init() {
    const accent = localStorage.getItem('phantom_accent') || '#ff8c00';
    const cursor = localStorage.getItem('phantom_cursor') || 'default';
    const wallpaper = localStorage.getItem('phantom_wallpaper') || '';
    const cloakOn = localStorage.getItem('phantom_cloak_on') === 'true';
    const cloakName = localStorage.getItem('phantom_cloak_name') || '';
    const cloakIcon = localStorage.getItem('phantom_cloak_icon') || '';

    applyAccent(accent);
    
    if (cursor === 'dot') enableDotCursor();
    else { disableDotCursor(); document.documentElement.style.cursor = (cursor === 'default' ? '' : cursor); }

    if (wallpaper) {
        document.body.style.backgroundImage = `url('${wallpaper}')`;
        document.body.style.backgroundSize = 'cover';
        document.body.style.backgroundPosition = 'center';
    }

    if (cloakOn && cloakName) {
        document.title = cloakName;
        let link = document.querySelector("link[rel='icon']");
        if (!link) { link = document.createElement('link'); link.rel = 'icon'; document.head.appendChild(link); }
        link.href = cloakIcon;
    }
})();
</script>
</body>
</html>
