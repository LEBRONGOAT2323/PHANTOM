<!DOCTYPE html>
<html>
<head>
    <title>Pixel Panic</title>

      <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏎️</text></svg>">
      <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: black;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .credit {
            position: fixed;
            bottom: 10px;
            right: 10px;
            font-size: 12px;
        }

        .credit a {
            color: white;
            text-decoration: none;
            opacity: 0.6;
            transition: opacity 0.2s ease;
             font-family: 'Orbitron';
        }

        .credit a:hover {
            opacity: 1;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<iframe src="https://pixel-idk.vercel.app/" loading="lazy" allowfullscreen></iframe>

<div class="credit">
    <a href="https://github.com/Want-to-beAcoder1556" target="_blank">
        External game by Want-to-beAcoder1556
    </a>
</div>

</body>
</html>
