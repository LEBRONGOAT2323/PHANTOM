<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PHANTOM — Account</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root {
    --accent: #ff8c00;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Orbitron', sans-serif;
    background: #000;
    color: #fff;
    min-height: 100vh;
    overflow-x: hidden;
}

/* =========================
   BACKGROUND
========================= */

#stars {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
}

.star {
    position: absolute;
    background: rgba(255,255,255,.7);
    border-radius: 50%;
    animation: drift linear infinite;
}

@keyframes drift {
    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(-120vh);
    }
}

#bottom-glow {
    position: fixed;
    bottom: -35vh;
    left: 50%;
    transform: translateX(-50%);
    width: 140vw;
    height: 80vh;
    z-index: 0;
    pointer-events: none;
}

/* =========================
   PAGE
========================= */

.page {
    position: relative;
    z-index: 2;

    width: min(820px, calc(100% - 28px));

    margin: auto;

    padding: 30px 0 80px;
}

/* =========================
   BACK
========================= */

.back-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;

    color: rgba(255,255,255,.5);

    font-family: 'Orbitron', sans-serif;
    font-size: .65rem;
    letter-spacing: 2px;

    background: none;
    border: none;

    cursor: pointer;

    margin-bottom: 25px;

    transition: .2s;
}

.back-btn:hover {
    color: var(--accent);
}

/* =========================
   TITLE
========================= */

.logo {
    font-size: clamp(2.5rem, 7vw, 4.5rem);

    font-weight: 900;

    letter-spacing: 10px;

    margin-bottom: 8px;

    color: #fff;
}

.subtitle {
    font-size: .65rem;

    letter-spacing: 3px;

    color: rgba(255,255,255,.4);

    margin-bottom: 28px;
}

/* =========================
   PROFILE
========================= */

.profile-card {
    overflow: hidden;

    background: rgba(255,255,255,.025);

    border: 1px solid rgba(255,255,255,.08);

    border-radius: 18px;

    backdrop-filter: blur(14px);

    margin-bottom: 16px;
}

/* =========================
   BANNER
========================= */

.banner {
    height: 190px;

    position: relative;

    background:
        radial-gradient(
            circle at center,
            rgba(255,140,0,.15),
            transparent 65%
        );

    background-size: cover;

    background-position: center;

    border-bottom: 1px solid rgba(255,255,255,.07);
}

.banner-overlay {
    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            to bottom,
            transparent 40%,
            rgba(0,0,0,.65)
        );
}

/* =========================
   CAMERA BUTTON
========================= */

.camera-btn {
    position: absolute;

    width: 34px;
    height: 34px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,.65);

    border: 1px solid rgba(255,255,255,.18);

    color: rgba(255,255,255,.75);

    cursor: pointer;

    backdrop-filter: blur(10px);

    transition: .2s;

    z-index: 5;
}

.camera-btn:hover {
    color: var(--accent);

    border-color: var(--accent);

    box-shadow:
        0 0 15px rgba(255,140,0,.2);

    transform: scale(1.05);
}

.banner-camera {
    right: 15px;
    top: 15px;
}

.profile-camera {
    right: -2px;
    bottom: 0;
}

/* =========================
   PROFILE CONTENT
========================= */

.profile-content {
    padding: 0 25px 25px;

    position: relative;
}

/* =========================
   AVATAR
========================= */

.avatar-wrapper {
    position: relative;

    width: 96px;
    height: 96px;

    margin-top: -48px;

    margin-bottom: 15px;
}

.avatar {
    width: 96px;
    height: 96px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    background: #111;

    border: 3px solid #000;

    box-shadow:
        0 0 0 1px var(--accent),
        0 0 25px rgba(255,140,0,.15);

    font-size: 1.7rem;

    font-weight: 800;

    color: #fff;
}

.avatar img {
    width: 100%;
    height: 100%;

    object-fit: cover;
}

/* =========================
   USER INFO
========================= */

.username {
    font-size: 1.15rem;

    font-weight: 700;

    letter-spacing: 2px;

    color: #fff;
}

.email {
    margin-top: 7px;

    font-size: .55rem;

    letter-spacing: 1px;

    color: rgba(255,255,255,.35);
}

/* =========================
   BADGES
========================= */

.badges {
    display: flex;

    gap: 8px;

    margin-top: 12px;
}

.badge {
    display: inline-flex;

    align-items: center;

    gap: 6px;

    padding: 5px 9px;

    border-radius: 6px;

    font-size: .5rem;

    letter-spacing: 1.5px;

    color: rgba(255,255,255,.55);

    background: rgba(255,255,255,.045);

    border: 1px solid rgba(255,255,255,.08);
}

.admin-badge {
    color: var(--accent);

    background: rgba(255,140,0,.08);

    border-color: rgba(255,140,0,.28);

    box-shadow:
        0 0 12px rgba(255,140,0,.06);
}

/* =========================
   STATS
========================= */

.stats {
    display: grid;

    grid-template-columns: repeat(3,1fr);

    gap: 10px;

    margin-top: 22px;
}

.stat {
    padding: 17px;

    text-align: center;

    border-radius: 11px;

    background: rgba(255,255,255,.025);

    border: 1px solid rgba(255,255,255,.06);
}

.stat-number {
    color: var(--accent);

    font-size: 1rem;

    margin-bottom: 6px;
}

.stat-label {
    color: rgba(255,255,255,.35);

    font-size: .45rem;

    letter-spacing: 1.5px;
}

/* =========================
   PANELS
========================= */

.panel {
    background: rgba(255,255,255,.025);

    border: 1px solid rgba(255,255,255,.08);

    border-radius: 18px;

    padding: 24px;

    backdrop-filter: blur(14px);

    margin-bottom: 16px;
}

.panel-title {
    color: var(--accent);

    font-size: .65rem;

    letter-spacing: 3px;

    margin-bottom: 18px;
}

/* =========================
   ACHIEVEMENTS
========================= */

.achievement {
    display: flex;

    align-items: center;

    gap: 14px;

    padding: 13px;

    background: rgba(255,255,255,.025);

    border: 1px solid rgba(255,255,255,.06);

    border-radius: 11px;

    margin-bottom: 8px;
}

.achievement-icon {
    width: 42px;
    height: 42px;

    border-radius: 10px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(255,255,255,.04);

    font-size: 1.1rem;
}

.achievement-name {
    font-size: .6rem;

    letter-spacing: 1px;

    color: #fff;
}

.achievement-description {
    font-size: .48rem;

    margin-top: 5px;

    color: rgba(255,255,255,.35);
}

.empty {
    text-align: center;

    padding: 25px;

    font-size: .55rem;

    letter-spacing: 1px;

    color: rgba(255,255,255,.3);
}

/* =========================
   BUTTONS
========================= */

.btn {
    width: 100%;

    padding: 12px 18px;

    border-radius: 10px;

    font-family: 'Orbitron', sans-serif;

    font-size: .6rem;

    letter-spacing: 2px;

    cursor: pointer;

    transition: .2s;
}

.logout-btn {
    margin-top: 20px;

    color: rgba(255,255,255,.55);

    background: rgba(255,255,255,.035);

    border: 1px solid rgba(255,255,255,.1);
}

.logout-btn:hover {
    color: #fff;

    border-color: rgba(255,255,255,.2);
}

/* =========================
   HIDDEN FILE INPUTS
========================= */

.file-input {
    display: none;
}

/* =========================
   TOAST
========================= */

.toast {
    position: fixed;

    bottom: 25px;
    left: 50%;

    transform: translateX(-50%) translateY(20px);

    opacity: 0;

    pointer-events: none;

    z-index: 999;

    padding: 11px 20px;

    border-radius: 10px;

    font-size: .55rem;

    letter-spacing: 1.5px;

    backdrop-filter: blur(12px);

    transition: .25s;
}

.toast.show {
    opacity: 1;

    transform:
        translateX(-50%)
        translateY(0);
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:550px) {

    .page {
        width: calc(100% - 20px);

        padding-top: 20px;
    }

    .banner {
        height: 150px;
    }

    .profile-content {
        padding: 0 18px 20px;
    }

    .stats {
        grid-template-columns: 1fr 1fr 1fr;
    }

    .stat {
        padding: 13px 7px;
    }

}

</style>
</head>

<body>

<div id="stars"></div>
<div id="bottom-glow"></div>

<div class="page">

    <button class="back-btn" onclick="history.back()">
        <i class="fa-solid fa-chevron-left"></i>
        BACK
    </button>

    <h1 class="logo">PHANTOM</h1>

    <div class="subtitle">
        ACCOUNT
    </div>


    <!-- =========================
         PROFILE
    ========================== -->

    <div class="profile-card">

        <!-- BANNER -->

        <div
            class="banner"
            id="banner"
        >

            <div class="banner-overlay"></div>

            <button
                class="camera-btn banner-camera"
                onclick="document.getElementById('bannerInput').click()"
                title="Change banner"
            >
                <i class="fa-solid fa-camera"></i>
            </button>

            <input
                type="file"
                id="bannerInput"
                class="file-input"
                accept="image/png,image/jpeg,image/webp,image/gif"
            >

        </div>


        <!-- PROFILE INFO -->

        <div class="profile-content">

            <div class="avatar-wrapper">

                <div
                    class="avatar"
                    id="avatar"
                >
                    ?
                </div>

                <button
                    class="camera-btn profile-camera"
                    onclick="document.getElementById('avatarInput').click()"
                    title="Change profile picture"
                >
                    <i class="fa-solid fa-camera"></i>
                </button>

                <input
                    type="file"
                    id="avatarInput"
                    class="file-input"
                    accept="image/png,image/jpeg,image/webp,image/gif"
                >

            </div>


            <div
                class="username"
                id="profileUsername"
            >
                USER
            </div>

            <div
                class="email"
                id="profileEmail"
            >
                EMAIL
            </div>


            <div class="badges">

                <div
                    class="badge"
                    id="memberBadge"
                >
                    <i class="fa-solid fa-user"></i>
                    MEMBER
                </div>

                <div
                    class="badge admin-badge"
                    id="adminBadge"
                    style="display:none;"
                >
                    <i class="fa-solid fa-crown"></i>
                    ADMIN
                </div>

            </div>


            <!-- STATS -->

            <div class="stats">

                <div class="stat">

                    <div
                        class="stat-number"
                        id="achievementCount"
                    >
                        0
                    </div>

                    <div class="stat-label">
                        ACHIEVEMENTS
                    </div>

                </div>


                <div class="stat">

                    <div
                        class="stat-number"
                        id="memberSince"
                    >
                        --
                    </div>

                    <div class="stat-label">
                        MEMBER SINCE
                    </div>

                </div>


                <div class="stat">

                    <div
                        class="stat-number"
                        id="accountStatus"
                    >
                        ACTIVE
                    </div>

                    <div class="stat-label">
                        STATUS
                    </div>

                </div>

            </div>


            <button
                class="btn logout-btn"
                onclick="logout()"
            >
                <i class="fa-solid fa-right-from-bracket"></i>
                LOG OUT
            </button>

        </div>

    </div>


    <!-- =========================
         ACHIEVEMENTS
    ========================== -->

    <div class="panel">

        <div class="panel-title">
            <i class="fa-solid fa-trophy"></i>
            ACHIEVEMENTS
        </div>

        <div id="achievementsList">

            <div class="empty">
                NO ACHIEVEMENTS YET
            </div>

        </div>

    </div>

</div>


<div
    class="toast"
    id="toast"
></div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://xxzrbpglmgzoisjnnezy.supabase.co";

const SUPABASE_ANON_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh4enJicGdsbWd6b2lzam5uZXp5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5ODczMzksImV4cCI6MjEwMjU2MzMzOX0.Bn086psa2kjtpy5U08NDEiRcBP5yM8dKuuzxv4Uwcxo";

const {
    createClient
} = window.supabase;

const db = createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


/* =========================================================
   STARS
========================================================= */

const stars =
    document.getElementById("stars");

for(let i = 0; i < 90; i++) {

    const star =
        document.createElement("div");

    star.className = "star";

    const size =
        Math.random() * 2 + 1;

    star.style.cssText = `
        width:${size}px;
        height:${size}px;
        left:${Math.random() * 100}%;
        top:${Math.random() * 120}%;
        opacity:${Math.random() * .6 + .2};
        animation-duration:${Math.random() * 80 + 80}s;
        animation-delay:-${Math.random() * 100}s;
    `;

    stars.appendChild(star);
}


/* =========================================================
   THEME
========================================================= */

function hexToRgb(hex) {

    hex = hex.replace("#","");

    return {
        r: parseInt(hex.substring(0,2),16),
        g: parseInt(hex.substring(2,4),16),
        b: parseInt(hex.substring(4,6),16)
    };

}

function rgba(hex, alpha) {

    const c = hexToRgb(hex);

    return `rgba(${c.r},${c.g},${c.b},${alpha})`;

}


function applyTheme(color) {

    document.documentElement
        .style
        .setProperty("--accent", color);

    document.querySelector(".logo").style.textShadow = `
        0 0 6px rgba(255,255,255,.15),
        0 0 15px ${rgba(color,.4)},
        0 0 30px ${rgba(color,.25)},
        0 0 60px ${rgba(color,.15)}
    `;

    document.getElementById("bottom-glow").style.background = `
        radial-gradient(
            ellipse at center,
            ${rgba(color,.12)} 0%,
            ${rgba(color,.04)} 35%,
            transparent 70%
        )
    `;
}


/*
   Get PHANTOM's existing accent.

   This does NOT allow the user to
   change the accent from this page.
*/

applyTheme(
    localStorage.getItem("phantom_accent")
    || "#ff8c00"
);


/* =========================================================
   TOAST
========================================================= */

function toast(message) {

    const el =
        document.getElementById("toast");

    el.textContent = message;

    const color =
        getComputedStyle(document.documentElement)
            .getPropertyValue("--accent")
            .trim();

    el.style.background =
        rgba(color,.12);

    el.style.border =
        `1px solid ${rgba(color,.35)}`;

    el.style.color = color;

    el.classList.add("show");

    setTimeout(() => {

        el.classList.remove("show");

    },2500);
}


/* =========================================================
   LOAD PROFILE
========================================================= */

async function loadProfile(user) {

    if(!user) {

        location.href = "index.html";

        return;
    }


    const {
        data: profile,
        error
    } = await db
        .from("profiles")
        .select("*")
        .eq("id",user.id)
        .single();


    if(error) {

        console.error(error);

        toast("PROFILE COULD NOT LOAD");

        return;
    }


    /* USERNAME */

    const username =
        profile.username || "USER";

    document.getElementById("profileUsername")
        .textContent = username;


    /* EMAIL */

    document.getElementById("profileEmail")
        .textContent =
        user.email || "";


    /* AVATAR */

    const avatar =
        document.getElementById("avatar");


    if(profile.avatar_url) {

        avatar.innerHTML = `
            <img
                src="${escapeHTML(profile.avatar_url)}"
                alt="Profile picture"
            >
        `;

    } else {

        avatar.textContent =
            username.charAt(0).toUpperCase();

    }


    /* BANNER */

    const banner =
        document.getElementById("banner");


    if(profile.banner_url) {

        banner.style.backgroundImage =
            `url("${profile.banner_url}")`;

    }


    /* ADMIN */

    const adminBadge =
        document.getElementById("adminBadge");


    if(profile.is_admin) {

        adminBadge.style.display =
            "inline-flex";

    } else {

        adminBadge.style.display =
            "none";

    }


    /* MEMBER SINCE */

    if(profile.created_at) {

        const date =
            new Date(profile.created_at);

        document.getElementById("memberSince")
            .textContent =
            date.toLocaleDateString(
                undefined,
                {
                    month:"short",
                    year:"numeric"
                }
            ).toUpperCase();

    }


    await loadAchievements(user.id);

}


/* =========================================================
   ACHIEVEMENTS
========================================================= */

async function loadAchievements(userId) {

    const {
        data,
        error
    } = await db
        .from("user_achievements")
        .select(`
            unlocked_at,
            achievements (
                name,
                description,
                icon
            )
        `)
        .eq("user_id",userId)
        .order("unlocked_at",{
            ascending:false
        });


    const list =
        document.getElementById("achievementsList");


    if(error) {

        console.error(error);

        list.innerHTML = `
            <div class="empty">
                COULD NOT LOAD ACHIEVEMENTS
            </div>
        `;

        return;
    }


    document.getElementById("achievementCount")
        .textContent =
        data.length;


    if(!data.length) {

        list.innerHTML = `
            <div class="empty">
                NO ACHIEVEMENTS YET
            </div>
        `;

        return;
    }


    list.innerHTML = "";


    data.forEach(item => {

        const achievement =
            item.achievements;

        if(!achievement)
            return;


        const el =
            document.createElement("div");

        el.className =
            "achievement";


        el.innerHTML = `

            <div class="achievement-icon">
                ${escapeHTML(
                    achievement.icon || "🏆"
                )}
            </div>

            <div>

                <div class="achievement-name">
                    ${escapeHTML(
                        achievement.name
                    )}
                </div>

                <div class="achievement-description">
                    ${escapeHTML(
                        achievement.description || ""
                    )}
                </div>

            </div>

        `;


        list.appendChild(el);

    });

}


/* =========================================================
   IMAGE UPLOAD
========================================================= */

async function uploadImage(file, type) {

    if(!file)
        return;


    const {
        data: {
            user
        }
    } = await db.auth.getUser();


    if(!user) {

        toast("NOT LOGGED IN");

        return;
    }


    /* Limit image size */

    if(file.size > 5 * 1024 * 1024) {

        toast("IMAGE MUST BE UNDER 5MB");

        return;
    }


    const extension =
        file.name.split(".").pop()
            .toLowerCase();


    const path =
        `${user.id}/${type}-${Date.now()}.${extension}`;


    toast("UPLOADING IMAGE...");


    const {
        error: uploadError
    } = await db.storage
        .from("avatars")
        .upload(
            path,
            file,
            {
                upsert:true,
                contentType:file.type
            }
        );


    if(uploadError) {

        console.error(uploadError);

        toast("UPLOAD FAILED");

        return;
    }


    const {
        data
    } = db.storage
        .from("avatars")
        .getPublicUrl(path);


    const imageUrl =
        data.publicUrl;


    const update = {};

    if(type === "avatar") {

        update.avatar_url =
            imageUrl;

    } else {

        update.banner_url =
            imageUrl;

    }


    const {
        error: updateError
    } = await db
        .from("profiles")
        .update(update)
        .eq("id",user.id);


    if(updateError) {

        console.error(updateError);

        toast("PROFILE COULD NOT SAVE");

        return;
    }


    if(type === "avatar") {

        document.getElementById("avatar")
            .innerHTML = `
                <img
                    src="${escapeHTML(imageUrl)}"
                    alt="Profile picture"
                >
            `;

    } else {

        document.getElementById("banner")
            .style.backgroundImage =
            `url("${imageUrl}")`;

    }


    toast(
        type === "avatar"
        ? "PROFILE PICTURE UPDATED"
        : "BANNER UPDATED"
    );

}


/* =========================================================
   FILE INPUTS
========================================================= */

document.getElementById("avatarInput")
    .addEventListener("change",function() {

        uploadImage(
            this.files[0],
            "avatar"
        );

        this.value = "";

    });


document.getElementById("bannerInput")
    .addEventListener("change",function() {

        uploadImage(
            this.files[0],
            "banner"
        );

        this.value = "";

    });


/* =========================================================
   LOGOUT
========================================================= */

async function logout() {

    const {
        error
    } = await db.auth.signOut();


    if(error) {

        toast("LOGOUT FAILED");

        return;
    }


    location.href = "index.html";
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value) {

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* =========================================================
   AUTH
========================================================= */

db.auth.onAuthStateChange(
    async (event,session) => {

        if(session && session.user) {

            await loadProfile(
                session.user
            );

        }

    }
);


/* =========================================================
   INITIALIZE
========================================================= */

async function initialize() {

    const {
        data: {
            session
        }
    } = await db.auth.getSession();


    if(session && session.user) {

        await loadProfile(
            session.user
        );

    } else {

        location.href =
            "index.html";

    }

}

initialize();
